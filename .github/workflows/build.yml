name: Wallora APK Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

env:
  TG_CHAT_ID: "-1001474066247"
  REPO_URL: "https://github.com/${{ github.repository }}"

jobs:
  build:
    name: Build and send APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          [ -n "$APK" ] || { echo "No APK was produced."; exit 1; }
          NAME="Wallora-${GITHUB_SHA::8}.apk"
          cp "$APK" "$NAME"
          echo "path=$NAME" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wallora-debug-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Send APK to Telegram
        if: success()
        env:
          TG_BOT_KEY: ${{ secrets.TG_BOT_KEY }}
          APK_PATH: ${{ steps.apk.outputs.path }}
          APK_NAME: ${{ steps.apk.outputs.name }}
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${TG_BOT_KEY:-}" ] || { echo "TG_BOT_KEY secret is not configured."; exit 1; }
          curl --fail --silent --show-error --retry 3 \
            -F "document=@${APK_PATH};filename=${APK_NAME}" \
            -F "chat_id=${TG_CHAT_ID}" \
            --form-string "caption=📦 Wallora APK\nCommit: ${GITHUB_SHA::8}\n[View commit](${REPO_URL}/commit/${GITHUB_SHA})" \
            "https://api.telegram.org/bot${TG_BOT_KEY}/sendDocument"