name: Wallora APK Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and send APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Decode signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          [ -n "$ANDROID_KEYSTORE_BASE64" ] || { echo "Missing ANDROID_KEYSTORE_BASE64 secret"; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/wallora-release.jks"

      - name: Build debug APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/wallora-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          [ -n "$ANDROID_KEYSTORE_PASSWORD" ] || { echo "Missing ANDROID_KEYSTORE_PASSWORD secret"; exit 1; }
          [ -n "$ANDROID_KEY_ALIAS" ] || { echo "Missing ANDROID_KEY_ALIAS secret"; exit 1; }
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          [ -n "$APK" ] || { echo "No APK was produced."; exit 1; }
          NAME="Wallora-${GITHUB_SHA::8}.apk"
          cp "$APK" "$NAME"
          echo "path=$NAME" >> "$GITHUB_OUTPUT"

      - name: Send APK to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python .github/scripts/telegram.py document --file "${{ steps.apk.outputs.path }}"
