name: Wallora APK Build

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  REPO_URL: "https://github.com/${{ github.repository }}"

jobs:
  build:
    name: Build and send APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Notify Telegram build started
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/telegram.py message --text "🤖 Wallora build started — ${GITHUB_SHA::8}"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          [ -n "$APK" ] || { echo "No APK was produced."; exit 1; }
          NAME="Wallora-${GITHUB_SHA::8}.apk"
          cp "$APK" "$NAME"
          echo "path=$NAME" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wallora-debug-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Send APK to Telegram
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/telegram.py document \
            --file "${{ steps.apk.outputs.path }}" \
            --caption "📦 Wallora APK\nCommit: ${GITHUB_SHA::8}\n[View commit](${REPO_URL}/commit/${GITHUB_SHA})" \
            --parse-mode Markdown

      - name: Notify Telegram build finished
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/telegram.py message --text "✅ Wallora build finished — ${GITHUB_SHA::8}"
