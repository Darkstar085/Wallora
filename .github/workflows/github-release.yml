name: Wallora Release

on:
  push:
    branches:
      - main
    paths:
      - "version.properties"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and create release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Decode release signing key
        env:
          WALLORA_KEYSTORE_BASE64: ${{ secrets.WALLORA_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          [ -n "$WALLORA_KEYSTORE_BASE64" ] || { echo "Missing WALLORA_KEYSTORE_BASE64 secret"; exit 1; }
          printf '%s' "$WALLORA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/wallora-release.jks"

      - name: Prepare release
        id: prepare
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/release.py --prepare

      - name: Build release APK
        if: steps.prepare.outputs.release_needed == 'true'
        env:
          WALLORA_KEYSTORE_PATH: ${{ runner.temp }}/wallora-release.jks
          WALLORA_STORE_PASSWORD: ${{ secrets.WALLORA_STORE_PASSWORD }}
          WALLORA_KEY_ALIAS: ${{ secrets.WALLORA_KEY_ALIAS }}
          WALLORA_KEY_PASSWORD: ${{ secrets.WALLORA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "$WALLORA_STORE_PASSWORD" ] || { echo "Missing WALLORA_STORE_PASSWORD secret"; exit 1; }
          [ -n "$WALLORA_KEY_ALIAS" ] || { echo "Missing WALLORA_KEY_ALIAS secret"; exit 1; }
          [ -n "$WALLORA_KEY_PASSWORD" ] || { echo "Missing WALLORA_KEY_PASSWORD secret"; exit 1; }
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Publish release
        if: steps.prepare.outputs.release_needed == 'true'
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release.py --publish
