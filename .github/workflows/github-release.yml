name: Wallora Release

on:
  push:
    branches: [main]
    paths:
      - "app/build.gradle.kts"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and create release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Read version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          VERSION_CODE="$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n 1)"
          [ -n "$VERSION_NAME" ] || { echo "Could not determine versionName."; exit 1; }
          TAG="v${VERSION_NAME}"
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Check version bump
        id: bump
        shell: bash
        run: |
          set -euo pipefail
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --unified=0 "$BEFORE" HEAD -- app/build.gradle.kts | grep -Eq '^[+-].*version(Name|Code)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check existing release
        id: release
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK
        if: steps.bump.outputs.changed == 'true' && steps.release.outputs.exists != 'true'
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare release APK
        if: steps.bump.outputs.changed == 'true' && steps.release.outputs.exists != 'true'
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          [ -n "$APK" ] || { echo "No APK was produced."; exit 1; }
          NAME="Wallora_v${{ steps.version.outputs.version }}.apk"
          cp "$APK" "$NAME"
          echo "path=$NAME" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        if: steps.bump.outputs.changed == 'true' && steps.release.outputs.exists != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          CHANGELOG=""
          if [ -f CHANGELOG.md ]; then
            CHANGELOG="CHANGELOG.md"
          elif [ -f changelog.md ]; then
            CHANGELOG="changelog.md"
          fi

          [ -n "$CHANGELOG" ] || { echo "CHANGELOG.md is required for releases."; exit 1; }

          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found=1; print; next }
            found && /^## \\[/ { exit }
            found { print }
          ' "$CHANGELOG" > RELEASE_NOTES.md

          [ -s RELEASE_NOTES.md ] || { echo "No changelog entry found for v$VERSION."; exit 1; }

      - name: Create GitHub release
        if: steps.bump.outputs.changed == 'true' && steps.release.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          APK_PATH: ${{ steps.apk.outputs.path }}
        run: |
          gh release create "$TAG" "$APK_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Wallora v${VERSION}" \
            --notes-file RELEASE_NOTES.md
