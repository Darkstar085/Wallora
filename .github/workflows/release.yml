name: Wallora Release

on:
  workflow_dispatch:

concurrency:
  group: wallora-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate version
        id: validate
        run: python .github/scripts/release.py validate

      - if: steps.validate.outputs.release == 'true'
        name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - if: steps.validate.outputs.release == 'true'
        name: Decode signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          [ -n "$ANDROID_KEYSTORE_BASE64" ] || { echo "Missing ANDROID_KEYSTORE_BASE64 secret"; exit 1; }
          printf "%s" "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/wallora-release.jks"

      - if: steps.validate.outputs.release == 'true'
        name: Build signed APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/wallora-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "$ANDROID_KEYSTORE_PASSWORD" ] || { echo "Missing ANDROID_KEYSTORE_PASSWORD secret"; exit 1; }
          [ -n "$ANDROID_KEY_ALIAS" ] || { echo "Missing ANDROID_KEY_ALIAS secret"; exit 1; }
          [ -n "$ANDROID_KEY_PASSWORD" ] || { echo "Missing ANDROID_KEY_PASSWORD secret"; exit 1; }
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - if: steps.validate.outputs.release == 'true'
        name: Generate release notes
        run: python .github/scripts/release.py notes

      - if: steps.validate.outputs.release == 'true'
        name: Prepare release APK
        id: prepare
        run: python .github/scripts/release.py prepare

      - if: steps.validate.outputs.release == 'true'
        name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/release.py publish

      - if: steps.validate.outputs.release == 'true'
        name: Send release APK to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          RELEASE_CHAT_ID: ${{ secrets.RELEASE_CHAT_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python .github/scripts/telegram.py "${{ steps.prepare.outputs.apk }}" release
